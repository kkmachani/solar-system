apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: solar-system
  name: solarsystem
  namespace: _{_NSPACE_}_
spec:
  replicas: _{_REPLICA_}_
  selector:
    matchLabels:
      app: solar-system
  strategy: {}
  template:
    metadata:
      labels:
        app: solar-system
    spec:
      containers:
      - image: _{_K8S_IMAGE_}_
        imagePullPolicy: Always
        name: solar-system
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        envFrom:
        - secretRef:
            name: mongo-db-creds